# Verification for the self-host fork. ONE command owns the checks and this
# workflow only runs it: `npm run verify` (scripts/verify-fork.mjs). The same
# command is the Workers Builds deploy gate for this Worker, whose build command
# is `npm run verify && npm run build`, so a broken main cannot be deployed any
# more than it can be merged. Adding a check means editing that script, not this
# file, or the two gates drift apart.
#
# The script gates on deltas, not on a clean tree, because upstream is not
# clean: upstream c57671f (the base commit) typechecks with 18 errors and lints
# with 63. The known-good sets are committed as tests/tsc-baseline.txt and
# tests/eslint-baseline.txt - deliberately committed rather than fetched, so a
# run never needs the upstream repo and never goes red because upstream moved.
# A diagnostic that is not in a baseline fails; one that no longer reproduces is
# reported as info only, since the fork deletes upstream files. Two test files
# fail on the base as well and are allowlisted inside the script;
# tests/manual-dns-mode.test.mjs must always pass. See the script header for the
# full list of what is and is not covered - nothing here exercises a real mail
# flow, which needs a Cloudflare account and a domain.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the same ref: this is a gate, not a report.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: fork invariants
    # Pinned, not ubuntu-latest: ubuntu-latest moves to Ubuntu 26 on
    # 2026-10-19 and the toolchain is part of what is being verified.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: the installs here are native build steps the app does
      # not use (better-sqlite3 and friends were dropped by this fork), and
      # running them costs a minute and a compiler toolchain.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

      # The deploy gate runs verify and build in one shell, so running build here
      # too is the honest check: it fails on a broken build the same way Workers
      # Builds would.
      - name: Build
        run: npm run build
